info:
  name: loadCurrentUser
  type: http
  seq: 1

http:
  method: GET
  url: "{{hostname}}/api/users/me"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();
        bru.setEnvVar("id", data.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
