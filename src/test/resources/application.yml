spring:
  application:
    name: ecommerce

  jwt:
    secret: test-secret-value-for-ci-only-not-for-prod-use-only

  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    username: test
    password: test

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  servlet:
    context-path: /api