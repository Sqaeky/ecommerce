spring:
  application:
    name: ecommerce

  config:
    import: optional:file:./keys/secrets.yaml

  datasource:
    url: jdbc:postgresql://192.168.50.9:5432/ecommerce

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  servlet:
    context-path: /api