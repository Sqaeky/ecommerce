spring:
  application:
    name: ecommerce

  config:
    import: optional:file:./keys/secrets.yaml

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true

server:
  servlet:
    context-path: /api